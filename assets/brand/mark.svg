<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="nmb-mark-title">
  <title id="nmb-mark-title">Noah Market Briefs</title>

  <!-- 바탕: 사이트와 같은 딥 잉크-네이비. 마크가 스스로 배경을 가지므로
       밝은 화면과 어두운 화면 어디에 놓여도 같은 모습으로 읽힌다. -->
  <rect width="64" height="64" rx="14" fill="#0b0f17"/>

  <!-- 마켓 와이어: 사이트의 시그니처 요소. 장중 궤적을 한 획으로 그린다. -->
  <path d="M14 37L21 30L28 34L35 24L42 28L50 16"
        fill="none" stroke="#ecc67e" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 마지막 값(종가)에 켜지는 등불 — 헤일로 먼저, 그 위에 점. -->
  <circle cx="50" cy="16" r="6.6" fill="#ecc67e" opacity=".18"/>
  <circle cx="50" cy="16" r="3.3" fill="#ecc67e"/>

  <!-- 원장 괘선 2줄: 기록으로 남는다는 뜻. 아래 줄을 짧게 두어 여백을 만든다. -->
  <path d="M14 47H50" stroke="#c79a4e" stroke-width="2.2" stroke-linecap="round" opacity=".62"/>
  <path d="M14 53H38" stroke="#c79a4e" stroke-width="2.2" stroke-linecap="round" opacity=".34"/>
</svg>
