<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 96" width="466" height="96" role="img" aria-labelledby="nmb-logo-title">
  <title id="nmb-logo-title">Noah Market Briefs</title>

  <!-- 심볼: mark.svg 와 같은 도형을 락업 높이에 맞춰 배치한다. -->
  <g transform="translate(8 16)">
    <rect width="64" height="64" rx="14" fill="#0b0f17"/>
    <path d="M14 37L21 30L28 34L35 24L42 28L50 16"
          fill="none" stroke="#ecc67e" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="16" r="6.6" fill="#ecc67e" opacity=".18"/>
    <circle cx="50" cy="16" r="3.3" fill="#ecc67e"/>
    <path d="M14 47H50" stroke="#c79a4e" stroke-width="2.2" stroke-linecap="round" opacity=".62"/>
    <path d="M14 53H38" stroke="#c79a4e" stroke-width="2.2" stroke-linecap="round" opacity=".34"/>
  </g>

  <!-- 워드마크. 읽는 사람의 시스템 세리프로 조판해 외부 폰트를 참조하지 않는
       순수 벡터로 남긴다(사이트 본문 세리프와 같은 계열). textLength 로 폭을
       고정해 어느 렌더러에서도 락업 비율이 유지된다.
       색은 깊은 황동 — 흰 배경과 어두운 배경 양쪽에서 모두 읽힌다. -->
  <text x="92" y="61" textLength="350" lengthAdjust="spacing"
        font-family="Georgia, 'Times New Roman', 'Nanum Myeongjo', serif"
        font-size="37" font-weight="600" fill="#a0742f">Noah Market Briefs</text>
</svg>
